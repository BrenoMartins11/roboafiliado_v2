services:
  # 1. Banco de Dados PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: postgres_afiliados
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-robo_afiliados}
    ports:
      - "5433:5432"
    volumes:
      - pgdata_afiliados:/var/lib/postgresql/data
    networks:
      - rede_afiliados

  # 2. Cache Redis (Necessário para a Evolution API v2)
  redis:
    image: redis:alpine
    container_name: evolution_redis
    restart: always
    networks:
      - rede_afiliados

  # 3. WhatsApp Evolution API
  # 3. WhatsApp Evolution API
  evolution_api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_TYPE=apikey # <-- Garante a autenticação por API Key
      - AUTHENTICATION_API_KEY=B6D711FCDE4D4FD5936544120E713976 # <-- Chave Global Fixa
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-robo_afiliados}?schema=evolution
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_api
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - postgres
      - redis
    networks:
      - rede_afiliados

  # 4. Robô de Afiliados
  robo:
    build: .
    container_name: robo_afiliados_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - EVOLUTION_API_URL=http://evolution_api:8080
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    depends_on:
      - postgres
      - evolution_api
    networks:
      - rede_afiliados

volumes:
  pgdata_afiliados:
    driver: local
  evolution_instances:
    driver: local

networks:
  rede_afiliados:
    driver: bridge