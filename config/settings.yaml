# ============================================================
#  CONFIGURAÇÕES DO ROBÔ DE AFILIADOS (MULTI-NICHO)
# ============================================================

mercadolivre:
  site_id: "MLB"
  affiliate_tag: "brunotsousa"  # Sua tag/nickname de afiliado

# ============================================================
#  5 NICHOS ESPECÍFICOS -> GRUPOS NO TELEGRAM & WHATSAPP
# ============================================================

# Nicho de Fitness, Treino & Suplementação
nichos:
  - id: "fitness"
    nome: "Mundo Fitness & Treino"
    categoria_id: "MLB1276"
    telegram_chat_id: "-1003913596243" #ofertas Breno
    whatsapp_group_id: "120363411874042187@g.us" # Ofertas Tech (nome do grupo no whatssapp)
    filtros:
      preco_minimo: 25.00
      desconto_minimo: 20


# Nicho 2: Vestuário & Calçados
  - id: "vestuario"
    nome: "Moda, Roupas & Calçados"
    categoria_id: "MLB1430"
    telegram_chat_id: "-1003999977018"        # Preencha com seu grupo de "promocoes tech"
    whatsapp_group_id: "120363426551167531@g.us"
    filtros:
      preco_minimo: 30.00
      desconto_minimo: 20

  # Nicho 3: Ferramentas & Oficina
  - id: "ferramentas"
    nome: "Ferramentas & Garagem"
    categoria_id: "MLB1500"
    telegram_chat_id: "-1004448289947"        # Preencha com seu grupo de ferramentas
    whatsapp_group_id: "120363412799370735@g.us"
    filtros:
      preco_minimo: 35.00
      desconto_minimo: 15

# ============================================================
#  FILTROS GERAIS (Fallback se não definido no nicho)
# ============================================================
# ============================================================
#  FILTROS GERAIS
# ============================================================
filtros_gerais:
  preco_minimo: 25.00
  preco_maximo: 8000.00
  avaliacao_minima: 4.0
  minimo_avaliacoes: 5
  desconto_minimo: 20
  frete_gratis: false
  palavras_obrigatorias: []
  palavras_bloqueadas:
    - "usado"
    - "seminovo"
    - "recondicionado"
    - "defeito"
  limite_produtos_por_nicho: 10       # <-- Aumenta de 3 para 8 produtos por lote

# ============================================================
#  AGENDAMENTO DA FILA
# ============================================================
agendamento:
  intervalo_minutos: 25              # <-- Descanso de 25 min após terminar a fila para buscar novas ofertas
  variacao_minutos: 5
  horario_inicio: "08:00"
  horario_fim: "22:00"
  intervalo_entre_mensagens_seg: 10  # <-- Posta 1 produto a cada ~60 segundos (1 minuto)
  intervalo_entre_nichos_seg: 10     # <-- Intervalo entre os nichos (30 segundos)

# ============================================================
#  TEMPLATES DE MENSAGEM
# ============================================================
mensagem:
  whatsapp_template: |
    🔥 *{nome}*

    💰 De: ~R$ {preco_original}~
    💥 *Por: R$ {preco}* ({desconto}% OFF)
    {frete_gratis}
    ⭐ {avaliacao} ({total_avaliacoes} avaliações)

    🛒 *Compre com desconto aqui:*
    {link}

  telegram_template: |
    🔥 *{nome}*

    💰 De: ~R$ {preco_original}~
    💥 *Por: R$ {preco}* ({desconto}% OFF)
    {frete_gratis}
    ⭐ {avaliacao} ({total_avaliacoes} avaliações)

    🛒 [CLIQUE AQUI PARA COMPRAR]({link})

  frete_gratis_texto: "🚚 ✅ Frete Grátis!"
  frete_pago_texto: ""

# ============================================================
#  BANCO DE DADOS E HISTÓRICO
# ============================================================
banco_dados:
  dias_para_reenviar: 7

# ============================================================
#  LOGS
# ============================================================
logging:
  level: "INFO"
  arquivo: "logs/robo.log"
